name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -oP "^version '\K[^']+" fxmanifest.lua)
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match fxmanifest version $manifest"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist/loop-scoot
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' --exclude '.gitattributes' --exclude '.gitignore' ./ dist/loop-scoot/
          cd dist && zip -qr loop-scoot.zip loop-scoot

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/loop-scoot.zip
          generate_release_notes: true
